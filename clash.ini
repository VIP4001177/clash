;=========================================
; ACL4SSR 纯手动节点 Clash 配置（示例节点）
;=========================================

;=====================
; 核心规则（全局手动切换）
;=====================
custom_proxy_group=☑️ 手动切换`select`[]🇭🇰 香港节点`[]🇺🇲 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`  ; 所有流量通过此组手动选择

;=====================
; 自定义节点组（示例节点）
;=====================
custom_proxy_group=🇭🇰 香港节点`select`[]
HongKong-1,socks5,127.0.0.1,1080
HongKong-2,socks5,127.0.0.1,1081

custom_proxy_group=🇺🇲 美国节点`select`[]
US-NewYork-1,socks5,127.0.0.1,1090
US-SanFrancisco-1,socks5,127.0.0.1,1091

custom_proxy_group=🇯🇵 日本节点`select`[]
JP-Tokyo-1,socks5,127.0.0.1,1100
JP-Osaka-1,socks5,127.0.0.1,1101

custom_proxy_group=🇸🇬 新加坡节点`select`[]
SG-Singapore-1,socks5,127.0.0.1,1110
SG-Singapore-2,socks5,127.0.0.1,1111

;=====================
; 规则生成器设置
;=====================
enable_rule_generator=true
overwrite_original_rules=true
