[common]
; =====================================
; ⚙️ 通用设置（纯手动版）
; =====================================

skip_duplicates = true     ; 自动去重节点
sort_proxies = true        ; 按名称排序节点
emoji = true               ; 显示节点前的国旗 Emoji
insert_rule = false        ; 禁止插入默认规则

[custom]
; =====================================
; ⚙️ 自定义设置（仅手动选择）
; =====================================

enable_rule_generator = true
overwrite_original_rules = true

; 所有流量完全由「手动选择」节点决定
ruleset = 手动选择,[]FINAL

; 仅一个手动选择代理组
custom_proxy_group = 手动选择`select`.*
