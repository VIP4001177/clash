# ==========================
# Clash 最简手动选择配置
# ==========================

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

# --------------------------
# 无代理节点
# --------------------------
proxies: []

# --------------------------
# 仅保留手动选择分组
# --------------------------
proxy-groups:
  - name: "Manual"
    type: select
    proxies: []

# --------------------------
# 基础规则
# --------------------------
rules:
  - GEOIP,CN,DIRECT
  - MATCH,Manual
