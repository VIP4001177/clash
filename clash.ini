;=========================================
; ACL4SSR 终极超极简 Clash 配置
; 完全手动切换节点，无测速、无分流
;=========================================

;=====================
; 自定义代理组
;=====================
custom_proxy_group=☑️ 手动切换`select`[].*  ; 核心手动切换组，所有流量走这里
custom_proxy_group=🇭🇰 香港节点`select`[].*   ; 自行在 UI 添加港节点
custom_proxy_group=🇺🇲 美国节点`select`[].*   ; 自行在 UI 添加美节点

;=====================
; 规则生成器设置
;=====================
enable_rule_generator=true
overwrite_original_rules=true
