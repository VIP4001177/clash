;=========================================
; ACL4SSR 纯手动节点 Clash 配置
;=========================================

;=====================
; 核心规则（全局手动切换）
;=====================
custom_proxy_group=☑️ 手动切换`select`[].*  ; 所有流量通过此组手动选择

;=====================
; 自定义节点组（可在 UI 添加节点）
;=====================
custom_proxy_group=🇭🇰 香港节点`select`[].*   ; 港节点，完全手动添加
custom_proxy_group=🇺🇲 美国节点`select`[].*   ; 美节点，完全手动添加

;=====================
; 规则生成器设置
;=====================
enable_rule_generator=true
overwrite_original_rules=true
