#=========================================
# ACL4SSR 超极简手动节点 Clash 配置
# 可直接导入，完全手动选择
#=========================================

#=====================
# 自定义节点组（示例节点）
#=====================
custom_proxy_group=HK_Nodes,select
HK-1,socks5,127.0.0.1,1080
HK-2,socks5,127.0.0.1,1081

custom_proxy_group=US_Nodes,select
US-NY,socks5,127.0.0.1,1090
US-SF,socks5,127.0.0.1,1091

custom_proxy_group=JP_Nodes,select
JP-Tokyo,socks5,127.0.0.1,1100
JP-Osaka,socks5,127.0.0.1,1101

custom_proxy_group=SG_Nodes,select
SG-1,socks5,127.0.0.1,1110
SG-2,socks5,127.0.0.1,1111

#=====================
# 核心手动切换组
#=====================
custom_proxy_group=Manual,select
HK_Nodes
US_Nodes
JP_Nodes
SG_Nodes

#=====================
# 规则生成器设置
#=====================
enable_rule_generator=true
overwrite_original_rules=true
