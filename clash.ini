[custom]

;======================= 广告 =======================
ruleset=REJECT,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset=REJECT,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Advertising/Advertising.yaml

;======================= AI =======================
ruleset=👤 AI应用,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml
ruleset=👤 AI应用,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml
ruleset=👤 AI应用,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml

;======================= 流媒体 =======================
ruleset=🎬 YouTube,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml
ruleset=🎬 Netflix,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.yaml
ruleset=🎵 TikTok,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml

;======================= 社交 =======================
ruleset=📠 Telegram,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.yaml
ruleset=👨‍💻 GitHub,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.yaml

;======================= 游戏 =======================
ruleset=🎮 游戏平台,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Game/Game.yaml

;======================= 国外 =======================
ruleset=🌎 国际网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Proxy/Proxy.yaml

;======================= 其他 =======================
ruleset=📍 IP归属地,clash-classic:https://raw.githubusercontent.com/lwd-temp/anti-ip-attribution/main/generated/rule-provider.yaml

;======================= 国内 =======================
; 优先放行局域网/保留地址，避免内网、路由器、NAS 等被误走代理
ruleset=🌎 国内网站,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
; 国内常用域名与服务直连，ChinaMax 覆盖更全，补齐传统 ChinaDomain 的遗漏
ruleset=🌎 国内网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/China/China.list
ruleset=🌎 国内网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMax/ChinaMax.list
ruleset=🌎 国内网站,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list
; 国内媒体与下载/CDN 场景直连，提升视频、音乐、应用更新和下载稳定性
ruleset=🌎 国内网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaMedia/ChinaMedia.list
ruleset=🌎 国内网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Download/Download.list
; 国内 IP 段兜底直连，先用规则集覆盖，再用 GEOIP,CN 做最终国内 IP 兜底
ruleset=🌎 国内网站,https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaIPs/ChinaIPs.list
ruleset=🌎 国内网站,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaCompanyIp.list
ruleset=🌎 国内网站,[]GEOIP,CN

;======================= FINAL =======================
ruleset=🗑️ 兜底策略,[]FINAL


;======================= 策略组 =======================

custom_proxy_group=🟢 节点选择`select`.*
custom_proxy_group=🌎 国际网站`select`[]🟢 节点选择
custom_proxy_group=🌎 国内网站`select`[]DIRECT
custom_proxy_group=👤 AI应用`select`[]🟢 节点选择
custom_proxy_group=📍 IP归属地`select`[]🟢 节点选择
custom_proxy_group=📠 Telegram`select`[]🟢 节点选择
custom_proxy_group=🎬 YouTube`select`[]🟢 节点选择
custom_proxy_group=🎵 TikTok`select`[]🟢 节点选择
custom_proxy_group=🎬 Netflix`select`[]🟢 节点选择
custom_proxy_group=👨‍💻 GitHub`select`[]🟢 节点选择
custom_proxy_group=🎮 游戏平台`select`[]DIRECT
custom_proxy_group=⛔ 广告拦截`select`[]REJECT
custom_proxy_group=🗑️ 兜底策略`select`[]🟢 节点选择`[]DIRECT
