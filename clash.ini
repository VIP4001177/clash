# ==========================
# Clash 完整手动节点配置
# ==========================

port: 7890
socks-port: 7891
allow-lan: true
mode: Rule
log-level: info
external-controller: 127.0.0.1:9090

# --------------------------
# 代理节点
# --------------------------
proxies:
  - name: "HongKong-1"
    type: ss
    server: hk1.example.com
    port: 8388
    cipher: aes-128-gcm
    password: "password123"

  - name: "Japan-1"
    type: ss
    server: jp1.example.com
    port: 8388
    cipher: aes-128-gcm
    password: "password123"

  - name: "Singapore-1"
    type: vmess
    server: sg1.example.com
    port: 443
    uuid: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
    alterId: 0
    tls: true

  - name: "USA-1"
    type: ss
    server: us1.example.com
    port: 8388
    cipher: aes-128-gcm
    password: "password123"

# --------------------------
# 代理分组（仅手动选择）
# --------------------------
proxy-groups:
  - name: "Manual"
    type: select
    proxies:
      - "HongKong-1"
      - "Japan-1"
      - "Singapore-1"
      - "USA-1"

# --------------------------
# 规则配置（国内直连，其余走手动分组）
# --------------------------
rules:
  - GEOIP,CN,DIRECT
  - MATCH,Manual
