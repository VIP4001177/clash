[common]
; =====================================
; ⚙️  通用设置（全局生效）
; =====================================

; ✅ 自动去重：防止相同节点重复出现
skip_duplicates = true

; ✅ 可选：按节点名排序（更整齐）
sort_proxies = true

; ✅ 可选：启用 Emoji 显示节点类型（如 🇸🇬、🇭🇰）
emoji = true

; ✅ 可选：禁止插入默认规则
insert_rule = false



[custom]
; ===========================
;   ACL4SSR 精简版 (仅手动选择)
; ===========================

enable_rule_generator = true
overwrite_original_rules = true

; ====== 基础规则 ======
ruleset = 全球直连,https://raw.githubusercontent.com/cmliu/ACL4SSR/refs/heads/main/Clash/CFnat.list
ruleset = 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
ruleset = 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/UnBan.list
ruleset = 全球拦截,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanAD.list
ruleset = 应用净化,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/BanProgramAD.list
ruleset = 全球直连,[]GEOIP,CN
ruleset = 漏网之鱼,[]FINAL

; ====== 代理组 (仅保留手动选择) ======
custom_proxy_group = 手动选择`select`.*
custom_proxy_group = 全球直连`select`[]手动选择
custom_proxy_group = 全球拦截`select`[]手动选择
custom_proxy_group = 应用净化`select`[]手动选择
custom_proxy_group = 漏网之鱼`select`[]手动选择
