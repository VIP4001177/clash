[common]
; =====================================
; ⚙️ 通用设置（纯手动版）
; =====================================

; 自动去重节点
skip_duplicates = true

; 按名称排序节点
sort_proxies = true

; 显示 Emoji 国旗
emoji = true

; 禁止插入默认规则
insert_rule = false



[custom]
; =====================================
; ⚙️ 自定义设置（仅手动选择）
; =====================================

enable_rule_generator = true
overwrite_original_rules = true

; ✅ 无任何规则，不分流
; ✅ 所有流量完全由「手动选择」决定
ruleset = 手动选择,[]FINAL

; ✅ 仅一个代理组，手动选节点
custom_proxy_group = 手动选择`select`.*
