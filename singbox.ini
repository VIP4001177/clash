{
  "log": {
    "disabled": false,
    "level": "info",
    "timestamp": true
  },

  "dns": {
    "strategy": "ipv4_only",
    "servers": [
      {
        "tag": "dns-direct",
        "address": "223.5.5.5",
        "detour": "direct"
      },
      {
        "tag": "dns-proxy",
        "address": "1.1.1.1",
        "detour": "auto"
      }
    ]
  },

  "inbounds": [
    {
      "type": "tun",
      "tag": "tun-in",
      "inet4_address": "172.19.0.1/30",
      "auto_route": true,
      "strict_route": true,
      "stack": "system"
    }
  ],

  "outbounds": [
    {
      "type": "selector",
      "tag": "manual",
      "outbounds": [
        "node-1",
        "node-2",
        "node-3"
      ]
    },
    {
      "type": "urltest",
      "tag": "auto",
      "outbounds": [
        "node-1",
        "node-2",
        "node-3"
      ],
      "url": "http://www.gstatic.com/generate_204",
      "interval": "300s",
      "tolerance": 50
    },

    { "type": "direct", "tag": "direct" },
    { "type": "block", "tag": "block" }
  ],

  "route": {
    "auto_detect_interface": true,
    "final": "auto",

    "rule_set": [
      { "tag": "github", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/GitHub/GitHub.yaml" },

      { "tag": "cn-domain", "type": "remote", "format": "domain-set", "url": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ChinaDomain.list" },
      { "tag": "cn-ipcidr", "type": "remote", "format": "ip-set", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ChinaIP/ChinaIP.list" },

      { "tag": "gfwlist", "type": "remote", "format": "domain-set", "url": "https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/ProxyGFWlist.list" },

      { "tag": "ai-openai", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/OpenAI/OpenAI.yaml" },
      { "tag": "ai-claude", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Claude/Claude.yaml" },
      { "tag": "ai-gemini", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Gemini/Gemini.yaml" },
      { "tag": "ai-copilot", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Copilot/Copilot.yaml" },
      { "tag": "ai-perplexity", "type": "remote", "format": "domain-set", "url": "https://raw.githubusercontent.com/cutethotw/ClashRule/main/Rule/Perplexity.list" },

      { "tag": "youtube", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/YouTube/YouTube.yaml" },
      { "tag": "netflix", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Netflix/Netflix.yaml" },
      { "tag": "tiktok", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/TikTok/TikTok.yaml" },
      { "tag": "spotify", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Spotify/Spotify.yaml" },

      { "tag": "telegram", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Telegram/Telegram.yaml" },
      { "tag": "discord", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/Discord/Discord.yaml" },

      { "tag": "adblock", "type": "remote", "format": "yaml", "url": "https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Clash/ZhihuAds/ZhihuAds.yaml" }
    ],

    "rules": [
      { "rule_set": "adblock", "outbound": "block" },

      { "rule_set": "cn-domain", "outbound": "direct" },
      { "rule_set": "cn-ipcidr", "outbound": "direct" },

      { "rule_set": "github", "outbound": "auto" },
      { "rule_set": "ai-openai", "outbound": "auto" },
      { "rule_set": "ai-claude", "outbound": "auto" },
      { "rule_set": "ai-gemini", "outbound": "auto" },
      { "rule_set": "ai-copilot", "outbound": "auto" },
      { "rule_set": "ai-perplexity", "outbound": "auto" },

      { "rule_set": "youtube", "outbound": "auto" },
      { "rule_set": "netflix", "outbound": "auto" },
      { "rule_set": "spotify", "outbound": "auto" },
      { "rule_set": "tiktok", "outbound": "auto" },

      { "rule_set": "telegram", "outbound": "auto" },
      { "rule_set": "discord", "outbound": "auto" },

      { "rule_set": "gfwlist", "outbound": "auto" }
    ]
  }
}
